name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0)"
        required: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Update CHANGELOG.md
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          PREV_VERSION=$(grep -m1 '^\[.*\]:' CHANGELOG.md | sed 's/^\[\(.*\)\]:.*/\1/')
          REPO=$(gh repo view --json nameWithOwner -q .nameWithOwner)

          # Build new changelog:
          # 1. Header (lines before ## [Unreleased])
          # 2. Empty ## [Unreleased] section
          # 3. New versioned section with current Unreleased content
          # 4. Previous versioned sections
          # 5. Updated comparison links

          # Extract header (everything before ## [Unreleased])
          HEADER=$(awk '/^## \[Unreleased\]/{exit} {print}' CHANGELOG.md)

          # Extract unreleased content (lines after ## [Unreleased] up to next ## [)
          UNRELEASED_CONTENT=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)

          # Extract existing versioned sections (from first ## [x.y.z] onward, before the links)
          VERSIONED=$(awk '/^## \[[0-9]/{found=1} found && /^\[.*\]:/{exit} found{print}' CHANGELOG.md)

          # Build comparison links
          LINKS="[Unreleased]: https://github.com/${REPO}/compare/v${VERSION}...HEAD"$'\n'
          LINKS+="[${VERSION}]: https://github.com/${REPO}/compare/v${PREV_VERSION}...v${VERSION}"$'\n'
          # Preserve existing versioned links (skip old [Unreleased] link)
          EXISTING_LINKS=$(grep '^\[' CHANGELOG.md | grep -v '^\[Unreleased\]' | grep -v "^\[${VERSION}\]")
          if [ -n "$EXISTING_LINKS" ]; then
            LINKS+="$EXISTING_LINKS"
          fi

          # Write new CHANGELOG.md
          {
            echo "$HEADER"
            echo "## [Unreleased]"
            echo ""
            echo "## [${VERSION}] - ${TODAY}"
            echo "$UNRELEASED_CONTENT"
            echo "$VERSIONED"
            echo "$LINKS"
          } > CHANGELOG.md

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changelog
        env:
          VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: release v${VERSION}"
          git push origin develop

      - name: Create release PR
        env:
          VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Release PR #$existing already exists — updating is not needed, it will pick up the new commit."
          else
            gh pr create \
              --base main \
              --head develop \
              --title "Release v${VERSION}" \
              --body "Production release of v${VERSION}. Merging this PR will deploy to Vercel and create a GitHub Release."
          fi
