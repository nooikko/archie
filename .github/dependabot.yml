version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # No target-branch: updates go to the default branch (main).
    # The repo is in maintenance mode, so routine bumps are batched into as few
    # PRs as possible to keep the queue short. Dependabot *security* PRs are
    # exempt from this cap and always open on their own.
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    ignore:
      # TypeScript 7 (the native port) does not expose the compiler API that
      # Next.js 16 builds against: `next build` fails with "TypeScript 7.x does
      # not provide the compiler API required by Next.js". Revisit once Next
      # supports it — or once we're willing to set experimental.useTypeScriptCli.
      # Minor/patch bumps within TypeScript 6 still come through normally.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # React and its types move in lockstep; split across PRs they cannot typecheck.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      radix:
        patterns: ["@radix-ui/*", "radix-ui"]
      test:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom", "vite", "@vitejs/*"]
      tooling:
        patterns: ["@biomejs/*", "typescript", "tsx", "husky", "@types/node"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tw-animate-css"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
