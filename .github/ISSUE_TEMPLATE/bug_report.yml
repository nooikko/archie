name: Bug Report
description: Something on the site is broken
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What's broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to...\n2. Click...\n3. See error"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: e.g. Chrome 124 on macOS
